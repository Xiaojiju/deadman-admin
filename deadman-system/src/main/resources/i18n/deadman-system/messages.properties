# 用户与 RBAC、字典的业务文案。键与 SystemErrorCodes 常量名对应。
result.ROLE_NOT_FOUND=角色不存在
result.ROLE_CODE_EXISTS=角色编码已存在
result.ROLE_SYSTEM_PROTECTED=系统内置角色不允许删除或禁用
result.ROLE_SUPER_ADMIN_PROTECTED=超级管理员角色不允许修改权限
result.PERMISSION_INVALID=存在无效的权限码
result.DEPARTMENT_NOT_FOUND=部门不存在
result.DEPARTMENT_CODE_EXISTS=部门编码已存在
result.DEPARTMENT_HAS_CHILDREN=存在下级部门，无法删除
result.DEPARTMENT_HAS_USERS=部门下存在用户，无法删除
result.POSITION_NOT_FOUND=职位不存在
result.POSITION_CODE_EXISTS=职位编码已存在
result.POSITION_HAS_USERS=职位下存在用户，无法删除
result.POSITION_DEPT_MISMATCH=职位所属部门与用户部门不一致
result.DICT_GROUP_NOT_FOUND=字典组不存在
result.DICT_GROUP_CODE_EXISTS=字典组编码已存在
result.DICT_GROUP_HAS_ITEMS=字典组下存在字典项，无法删除
result.DICT_LEVEL_INVALID=字典层数只能是 1、2 或 3
result.DICT_LEVEL_EXCEEDED=字典项超过该组允许的层数
result.DICT_LEVEL_SHRINK_BLOCKED=已有更深的字典项，不能缩小层数
result.DICT_ITEM_NOT_FOUND=字典项不存在
result.DICT_ITEM_CODE_EXISTS=字典项编码已存在
result.DICT_ITEM_HAS_CHILDREN=存在下级字典项，无法删除
result.DICT_ITEM_PARENT_INVALID=上级字典项无效
