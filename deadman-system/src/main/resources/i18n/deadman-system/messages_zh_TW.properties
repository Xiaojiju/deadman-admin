# 用户与 RBAC、字典的业务文案。键与 SystemErrorCodes 常量名对应。
result.ROLE_NOT_FOUND=角色不存在
result.ROLE_CODE_EXISTS=角色編碼已存在
result.ROLE_SYSTEM_PROTECTED=系統內置角色不允許刪除或禁用
result.ROLE_SUPER_ADMIN_PROTECTED=超級管理員角色不允許修改權限
result.PERMISSION_INVALID=存在無效的權限碼
result.DEPARTMENT_NOT_FOUND=部門不存在
result.DEPARTMENT_CODE_EXISTS=部門編碼已存在
result.DEPARTMENT_HAS_CHILDREN=存在下級部門，無法刪除
result.DEPARTMENT_HAS_USERS=部門下存在用戶，無法刪除
result.POSITION_NOT_FOUND=職位不存在
result.POSITION_CODE_EXISTS=職位編碼已存在
result.POSITION_HAS_USERS=職位下存在用戶，無法刪除
result.POSITION_DEPT_MISMATCH=職位所属部門與用戶部門不一致
result.DICT_GROUP_NOT_FOUND=字典組不存在
result.DICT_GROUP_CODE_EXISTS=字典組編碼已存在
result.DICT_GROUP_HAS_ITEMS=字典組下存在字典項，無法刪除
result.DICT_LEVEL_INVALID=字典層數只能是 1、2 或 3
result.DICT_LEVEL_EXCEEDED=字典項超過該組允許的層數
result.DICT_LEVEL_SHRINK_BLOCKED=已有更深的字典項，不能縮小層數
result.DICT_ITEM_NOT_FOUND=字典項不存在
result.DICT_ITEM_CODE_EXISTS=字典項編碼已存在
result.DICT_ITEM_HAS_CHILDREN=存在下級字典項，無法刪除
result.DICT_ITEM_PARENT_INVALID=上級字典項無效
