# 用户与 RBAC、字典的业务文案。键与 SystemErrorCodes 常量名对应。
result.ROLE_NOT_FOUND=Role not found
result.ROLE_CODE_EXISTS=Role code already exists
result.ROLE_SYSTEM_PROTECTED=Built-in roles cannot be deleted or disabled
result.ROLE_SUPER_ADMIN_PROTECTED=Super administrator role permissions cannot be changed
result.PERMISSION_INVALID=Invalid permission code
result.DEPARTMENT_NOT_FOUND=Department not found
result.DEPARTMENT_CODE_EXISTS=Department code already exists
result.DEPARTMENT_HAS_CHILDREN=Child departments exist and cannot be deleted
result.DEPARTMENT_HAS_USERS=Users exist in this department and it cannot be deleted
result.POSITION_NOT_FOUND=Position not found
result.POSITION_CODE_EXISTS=Position code already exists
result.POSITION_HAS_USERS=Users exist in this position and it cannot be deleted
result.POSITION_DEPT_MISMATCH=Position department does not match the user department
result.DICT_GROUP_NOT_FOUND=Dictionary group not found
result.DICT_GROUP_CODE_EXISTS=Dictionary group code already exists
result.DICT_GROUP_HAS_ITEMS=Dictionary items exist and the group cannot be deleted
result.DICT_LEVEL_INVALID=Dictionary depth must be 1, 2, or 3
result.DICT_LEVEL_EXCEEDED=Dictionary item exceeds the depth allowed by this group
result.DICT_LEVEL_SHRINK_BLOCKED=Deeper dictionary items exist and the depth cannot be reduced
result.DICT_ITEM_NOT_FOUND=Dictionary item not found
result.DICT_ITEM_CODE_EXISTS=Dictionary item code already exists
result.DICT_ITEM_HAS_CHILDREN=Child dictionary items exist and cannot be deleted
result.DICT_ITEM_PARENT_INVALID=Invalid parent dictionary item
