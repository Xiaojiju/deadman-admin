server:
  tomcat:
    # 与 spring.servlet.multipart 保持一致，避免 Tomcat 先于 Spring 以 1MB 默认限制拦截上传
    max-http-form-post-size: ${DEADMAN_PLUGIN_FILE_MAX_REQUEST_SIZE:15MB}
    max-swallow-size: ${DEADMAN_PLUGIN_FILE_MAX_REQUEST_SIZE:15MB}

spring:
  application:
    name: deadman-admin
  servlet:
    multipart:
      enabled: true
      max-file-size: ${DEADMAN_PLUGIN_FILE_MAX_SIZE:10MB}
      max-request-size: ${DEADMAN_PLUGIN_FILE_MAX_REQUEST_SIZE:15MB}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:}:${DB_PORT:3306}/${DB_NAME:}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:}
  cache:
    type: redis
    redis:
      time-to-live: 30m
      key-prefix: "deadman:cache:"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

deadman:
  jwt:
    secret: ${DEADMAN_JWT_SECRET:36796c58bf17e410ea17ea4460d3a26071cb1940991a12741d790ce83368d44e}
    access-expiration-ms: ${DEADMAN_JWT_ACCESS_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${DEADMAN_JWT_REFRESH_EXPIRATION_MS:604800000}
    expiration-ms: ${DEADMAN_JWT_EXPIRATION_MS:1800000}
    refresh-cookie-secure: ${DEADMAN_JWT_REFRESH_COOKIE_SECURE:false}
  security:
    multi-session-enabled: ${DEADMAN_MULTI_SESSION_ENABLED:true}
  user:
    user-code-prefix: ${DEADMAN_USER_CODE_PREFIX:DM}
  bootstrap:
    admin-enabled: ${DEADMAN_BOOTSTRAP_ADMIN_ENABLED:true}
    super-admin-username: ${DEADMAN_SUPER_ADMIN_USERNAME:admin}
    super-admin-password: ${DEADMAN_SUPER_ADMIN_PASSWORD:admin123456}
    super-admin-nickname: ${DEADMAN_SUPER_ADMIN_NICKNAME:系统管理员}
  cache:
    user-profile-ttl: ${DEADMAN_CACHE_USER_PROFILE_TTL:30m}
  component:
    client:
      enabled: ${DEADMAN_COMPONENT_CLIENT_ENABLED:true}
      jwt:
        secret: ${DEADMAN_CLIENT_JWT_SECRET:8f3c2a91d7e54b60c1a9f8e2d6b4c0a7e5f1d9b3c8a6e2f0d4b7c1a9e5f3d8b2c6}
        access-expiration-ms: ${DEADMAN_CLIENT_JWT_ACCESS_EXPIRATION_MS:1800000}
        refresh-expiration-ms: ${DEADMAN_CLIENT_JWT_REFRESH_EXPIRATION_MS:604800000}
        expiration-ms: ${DEADMAN_CLIENT_JWT_EXPIRATION_MS:1800000}
        refresh-cookie-secure: ${DEADMAN_CLIENT_JWT_REFRESH_COOKIE_SECURE:false}
      security:
        multi-session-enabled: ${DEADMAN_CLIENT_MULTI_SESSION_ENABLED:true}
      user:
        user-code-prefix: ${DEADMAN_CLIENT_USER_CODE_PREFIX:CL}
      cache:
        user-profile-ttl: ${DEADMAN_CLIENT_CACHE_USER_PROFILE_TTL:30m}
    wgb:
      enabled: ${DEADMAN_COMPONENT_WGB_ENABLED:true}
  plugin:
    websocket:
      enabled: ${DEADMAN_PLUGIN_WEBSOCKET_ENABLED:true}
      endpoint-path: /ws
      dispatch:
        max-retry: 3
        retry-interval: 30s
        batch-size: 50
    excel:
      enabled: ${DEADMAN_PLUGIN_EXCEL_ENABLED:true}
    file:
      enabled: ${DEADMAN_PLUGIN_FILE_ENABLED:true}
      default-provider: local
      max-file-size: ${DEADMAN_PLUGIN_FILE_MAX_SIZE:10MB}
      biz-type-strict: ${DEADMAN_PLUGIN_FILE_BIZ_TYPE_STRICT:true}
    storage-local:
      enabled: ${DEADMAN_PLUGIN_STORAGE_LOCAL_ENABLED:true}
      base-path: ${DEADMAN_PLUGIN_STORAGE_LOCAL_BASE_PATH:/data/deadman}
    data-scope:
      enabled: ${DEADMAN_PLUGIN_DATA_SCOPE_ENABLED:true}
    sms:
      enabled: ${DEADMAN_PLUGIN_SMS_ENABLED:true}
      code-ttl: ${DEADMAN_PLUGIN_SMS_CODE_TTL:5m}
      resend-interval: ${DEADMAN_PLUGIN_SMS_RESEND_INTERVAL:60s}
      code-length: ${DEADMAN_PLUGIN_SMS_CODE_LENGTH:6}
      log-code: ${DEADMAN_PLUGIN_SMS_LOG_CODE:true}
    sms-login:
      enabled: ${DEADMAN_PLUGIN_SMS_LOGIN_ENABLED:true}
      login-bindings:
        - group-id: client
          login-path-segment: sms
    identity:
      enabled: ${DEADMAN_PLUGIN_IDENTITY_ENABLED:true}
      real-name-enabled: ${DEADMAN_PLUGIN_IDENTITY_REAL_NAME_ENABLED:true}
      enterprise-enabled: ${DEADMAN_PLUGIN_IDENTITY_ENTERPRISE_ENABLED:true}
      required-on-register: ${DEADMAN_PLUGIN_IDENTITY_REQUIRED_ON_REGISTER:false}
      match-score-threshold: ${DEADMAN_PLUGIN_IDENTITY_MATCH_SCORE:70}
      liveness-score-threshold: ${DEADMAN_PLUGIN_IDENTITY_LIVENESS_SCORE:40}
      tencent:
        secret-id: ${TENCENT_IAI_SECRET_ID:}
        secret-key: ${TENCENT_IAI_SECRET_KEY:}
        region: ${TENCENT_IAI_REGION:ap-guangzhou}
        face-model-version: ${TENCENT_IAI_FACE_MODEL_VERSION:3.0}
    # 本地联调默认密钥（Base64 编码的 32 字节）；生产务必用环境变量覆盖
    crypto:
      enabled: ${DEADMAN_PLUGIN_CRYPTO_ENABLED:true}
      require-keys: ${DEADMAN_CRYPTO_REQUIRE_KEYS:true}
      strict-module-key: ${DEADMAN_CRYPTO_STRICT_MODULE_KEY:true}
      default-algorithm: AES_GCM_ENVELOPE
      default-key-id: default
      default-key: ${DEADMAN_CRYPTO_DEFAULT_KEY:tLNoqYPUm55T5YEf7BCcC9b3wkyYE7q/9+63+shhkCI=}
  support:
    client-file:
      enabled: ${DEADMAN_SUPPORT_CLIENT_FILE_ENABLED:true}
